name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Hush.app build/Hush.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hush
          path: build/Hush.zip
