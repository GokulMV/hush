name: release

# Publish a release from anywhere (the GitHub app on a phone works): Actions → release →
# Run workflow → enter the version. Does exactly what ./scripts/release.sh does on a Mac, on a
# GitHub-hosted Mac, signed with the same "Over&Out Self-Signed" certificate so users keep their
# permissions. One-time setup: ./scripts/setup-release-secrets.sh on the Mac that has the certificate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (needs a matching \"## <version>\" section in CHANGELOG.md)"
        required: true

concurrency: release

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check the secrets are set
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$P12" ] || [ -z "$TOKEN" ]; then
            echo "::error::Missing secrets. Run ./scripts/setup-release-secrets.sh once on the Mac with the signing certificate."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # A personal token, so the release commit/tag push and the tap update are allowed.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install the signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Trust the self-signed certificate for code signing (as setup-signing.sh does on a Mac).
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/identity.p12" -passin pass:"$P12_PASSWORD" -nokeys \
              -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/identity.p12"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Test
        run: swift test

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          gh auth setup-git
          ./scripts/release.sh "$VERSION"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
